<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var mql = window.matchMedia("(prefers-color-scheme: dark)");
        var t = localStorage.getItem("specmodule-webview.theme");
        var apply = function () {
          document.documentElement.classList.toggle("dark", t === "dark" || (!t && mql.matches));
        };
        apply();
        if (!t && mql.addEventListener) mql.addEventListener("change", apply);
      })();
    </script>
    <title>SpecModule Webview</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
