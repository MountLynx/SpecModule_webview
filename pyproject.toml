[project]
name = "specmodule-webview"
version = "0.1.0"
description = "SpecModule 可视化消费通道：FastAPI 薄层 + React SPA"
requires-python = ">=3.10"
# pillow：spawn 子进程与 server 同 venv，模块质量门/图片校验（ppt_master vendor）依赖它——
# 缺失时 gate 把一切图片误判 corrupt（elements.py `_valid_project_image_payload` ImportError→False）
# openai：llm/client.py 懒导入的 LLM SDK（config.json 的 provider 均 openai 兼容）——
# uv sync 按锁文件修剪手工 pip 安装的包，不声明则 spawn 子进程 LLM 调用全挂
# python-pptx：ppt_master 导出节点 svg_to_pptx 的底层库
# filelock：treechat 会话 JSONL 跨进程锁（CLI 与 webapp 同会话互踩收口，issue #16）
dependencies = ["specmodule", "fastapi>=0.110", "uvicorn[standard]>=0.29", "pillow>=10", "openai>=1", "python-pptx>=1", "filelock>=3.13"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "jsonschema>=4.26.0",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
treechat = "treechat.cli.repl:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*", "treechat*"]

[tool.uv.sources]
# 开发锚定兄弟仓库 editable——与 SpecModule 同仓迭代（uv.lock 记录该来源；
# 纯部署场景可改回 PyPI 解析，见 AGENTS.md 开发命令）
specmodule = { path = "../SpecModule", editable = true }
